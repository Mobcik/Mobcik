    .sayi { font-size: 12.5px; font-weight: 600; fill: #9FB6D3; }
    .serit { fill: #3A7BD5; fill-opacity: 0.07; }
    .dolu { fill: #3A7BD5; stroke: #7FB0FF; stroke-opacity: 0.8; stroke-width: 1.2; animation: pop 0.5s ease-out both; transform-box: fill-box; transform-origin: center; }
    .bos { fill: #3A4F6E; }
    .cubuk { fill: url(#cubuk); animation: uzat 0.9s ease-out both; transform-box: fill-box; transform-origin: left center; }
    .cerceve { fill: none; stroke: #3A7BD5; stroke-opacity: 0.35; }
    .g { animation: yuksel 0.6s ease-out both; }
    @keyframes pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
    @keyframes uzat { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes yuksel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
